apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-tower
  namespace: pakka
  labels:
    app.kubernetes.io/name: control-tower
    app.kubernetes.io/part-of: pakka
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-tower
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-tower
        app.kubernetes.io/part-of: pakka
    spec:
      containers:
        - name: control-tower
          image: pakka/control-tower:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: FLAGSMITH_URL
              value: http://host.orb.internal:8000
            - name: FLAGSMITH_ENV_KEY
              value: 6FBvm2ADWYXFgnoLnUgEGv
            - name: COURIER_SWIFTSHIP_URL
              value: http://swiftship.pakka.svc:8080
            - name: COURIER_DAKEXPRESS_URL
              value: http://dakexpress.pakka.svc:8080
            # Outbound HTTPS (Sarvam, Azure) leaves through the Mac's egress proxy (scripts/egress-proxy.mjs):
            # on our network OrbStack breaks TLS from pods. Remove these three if your containers reach the internet.
            - name: NODE_USE_ENV_PROXY
              value: "1"
            - name: HTTPS_PROXY
              value: http://host.orb.internal:3128
            - name: NO_PROXY
              value: localhost,127.0.0.1,.svc,.svc.cluster.local,.cluster.local,host.orb.internal
            - name: FLAGSMITH_MASTER_API_KEY
              valueFrom:
                secretKeyRef: { name: pakka-secrets, key: FLAGSMITH_MASTER_API_KEY, optional: true }
            - name: SARVAM_API_KEY
              valueFrom:
                secretKeyRef: { name: pakka-secrets, key: SARVAM_API_KEY, optional: true }
            - name: AZURE_ANTHROPIC_ENDPOINT
              valueFrom:
                secretKeyRef: { name: pakka-secrets, key: AZURE_ANTHROPIC_ENDPOINT, optional: true }
            - name: AZURE_ANTHROPIC_KEY
              valueFrom:
                secretKeyRef: { name: pakka-secrets, key: AZURE_ANTHROPIC_KEY, optional: true }
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: control-tower
  namespace: pakka
  labels:
    app.kubernetes.io/name: control-tower
    app.kubernetes.io/part-of: pakka
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: control-tower
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
